    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "RouteSight 路況觀測站",
        "alternateName": "RouteSight",
        "description": "整合全臺即時路況、道路事件、CCTV、停車場、YouBike 與捷運資訊的互動交通地圖。",
        "applicationCategory": "TravelApplication",
        "operatingSystem": "Any",
        "inLanguage": "zh-Hant-TW",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": 0,
          "priceCurrency": "TWD"
        }
      }

    <style>
      body {
        margin: 0;
      }
      .app-loading-shell {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        text-align: center;
        background: #f3f7fa;
        color: #062b5b;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      .app-loading-shell img {
        width: 4rem;
        object-fit: contain;
        animation: app-loading-pulse 1.4s ease-in-out infinite;
      }
      .app-loading-shell h1 {
        font-size: 1.2rem;
        font-weight: 700;
        margin: 0;
      }
      .app-loading-shell p {
        margin: 0;
        max-width: 360px;
        font-size: 1rem;
        color: #52697d;
      }
      @keyframes app-loading-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.08);
          opacity: 0.75;
        }
      }
    </style>

  <body>
    <div id="root">
      <!-- React 掛載時會整個換掉這裡的內容，所以這段只會在 JS 執行前短暫出現。 -->

        <img src="/Logo-icon-bg.png" alt="" />

    <script type="module" src="/src/main.tsx"></script>
