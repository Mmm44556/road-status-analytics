# Render Blueprint：一鍵建立前端（Static Site）／後端（Docker Web Service）／
# Redis（Key Value）三個服務。到 Render dashboard 選「New +」→「Blueprint」，
# 指到這個 repo，Render 會照這份檔案建好三個服務並提示你填入標記
# sync:false 的機密值（TDX／Geoapify／Gemini 金鑰）。
#
# 網域：正式網址走 Cloudflare 自訂網域（routesight.shungyou.com／
# api.routesight.shungyou.com），ALLOWED_ORIGINS 同時保留 .onrender.com
# 那組預設網址當備援，方便直接用 Render 給的網址測試、不用等 DNS 生效。
#
# 部署後要注意：
# 1. 如果建立時 Render 顯示 routesight-frontend／routesight-backend 這兩個
#    名稱已被占用而改配別的網址，記得回來同步改掉 ALLOWED_ORIGINS／
#    VITE_API_BASE_URL 這兩個值。
# 2. VITE_API_BASE_URL 是建置時就寫死進前端 bundle 的，所以要等後端的
#    api.routesight.shungyou.com 自訂網域在 Render 那邊驗證＋憑證都生效
#    後，才重新部署一次前端，不然這段時間前端會打一個還沒通的網址。

services:
  - type: web
    name: routesight-backend
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: TDX_CLIENT_ID
        sync: false
      - key: TDX_CLIENT_SECRET
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://routesight-frontend.onrender.com,https://routesight.shungyou.com
      - key: CACHE_NAMESPACE
        value: "roadmap:v1"
      - key: ENABLE_SYSTEM_STATS
        value: "false"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: routesight-redis
          property: connectionString

  - type: keyvalue
    name: routesight-redis
    plan: free
    # 空陣列＝只開放 Render 內部私有網路連線，不對公網開放。backend 是
    # 同帳號下的服務，會自動走內部連線字串連進來，不需要（也不應該）讓
    # Redis 暴露在公網上讓任何人都能嘗試連線。
    ipAllowList: []

  - type: web
    name: routesight-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://api.routesight.shungyou.com
    routes:
      # SPA：不存在的路徑交給前端 router 處理，而不是回 404
      # （跟 nginx.conf 裡 try_files 的效果一樣）。
      - type: rewrite
        source: /*
        destination: /index.html
