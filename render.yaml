# Render Blueprint：一鍵建立前端（Static Site）／後端（Docker Web Service）／
# Redis（Key Value）三個服務。到 Render dashboard 選「New +」→「Blueprint」，
# 指到這個 repo，Render 會照這份檔案建好三個服務並提示你填入標記
# sync:false 的機密值（TDX／Geoapify／Gemini 金鑰）。
#
# 部署後兩件事要注意：
# 1. 這裡把前後端網址寫死成 <name>.onrender.com（由下面各自的 name 決定），
#    如果建立時 Render 顯示該名稱已被占用而改配別的網址，記得回來同步
#    改掉 ALLOWED_ORIGINS／VITE_API_BASE_URL 這兩個值。
# 2. 之後接上 Cloudflare 自訂網域時，要把新網域加進 backend 的
#    ALLOWED_ORIGINS（逗號分隔可以放多個），不然前端會被 CORS 擋掉。

services:
  - type: web
    name: routesight-backend
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: TDX_CLIENT_ID
        sync: false
      - key: TDX_CLIENT_SECRET
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://routesight-frontend.onrender.com
      - key: CACHE_NAMESPACE
        value: "roadmap:v1"
      - key: ENABLE_SYSTEM_STATS
        value: "false"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: routesight-redis
          property: connectionString

  - type: keyvalue
    name: routesight-redis
    plan: free
    # Render Key Value 需要明確設定 ipAllowList 才能對外連線；連線本身
    # 還是靠 connectionString 裡的密碼保護，不是真的對外全開。
    ipAllowList:
      - source: 0.0.0.0/0
        description: allow backend service

  - type: web
    name: routesight-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://routesight-backend.onrender.com
    routes:
      # SPA：不存在的路徑交給前端 router 處理，而不是回 404
      # （跟 nginx.conf 裡 try_files 的效果一樣）。
      - type: rewrite
        source: /*
        destination: /index.html
